version: "3.8"

services:
  gateway1:
    image: ${IMAGE:-13.115.26.37:8000/im/im-gateway:latest}
    container_name: gateway1
    ports:
      - "8888:8888"  # 对外暴露 8888 端口
    environment:
      - PORT=8888
      - GATEWAY_ID=gateway1
      - GATEWAY_LIST=gateway2:8085,gateway3:8085  # 可以转发到的其他网关（选择最久没有连接的）
    networks:
      - gateway-network
    restart: unless-stopped
    volumes:
      - ~/gateway/gateway1:/app/logs

  gateway2:
    image: ${IMAGE:-13.115.26.37:8000/im/im-gateway:latest}
    container_name: gateway2
    expose:
      - "8085"
    environment:
      - PORT=8085
      - GATEWAY_ID=gateway2
      - GATEWAY_LIST=gateway1:8085,gateway3:8085
      - MAX_CONN_THRESHOLD=100
    networks:
      - gateway-network
    restart: unless-stopped
    volumes:
      - ~/gateway/gateway2:/app/logs

  gateway3:
    image: ${IMAGE:-13.115.26.37:8000/im/im-gateway:latest}
    container_name: gateway3
    expose:
      - "8085"
    environment:
      - PORT=8085
      - GATEWAY_ID=gateway3
      - GATEWAY_LIST=gateway1:8085,gateway2:8085
      - MAX_CONN_THRESHOLD=100
    networks:
      - gateway-network
    restart: unless-stopped
    volumes:
      - ~/gateway/gateway3:/app/logs

networks:
  gateway-network:
    driver: bridge
