version: '3.8'

services:
  gateway1:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: gateway1
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - GATEWAY_ID=gateway1
      - GATEWAY_LIST=gateway2:8085,gateway3:8085
    networks:
      - gateway-network
    restart: unless-stopped

  gateway2:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: gateway2
    ports:
      - "8087:8085"
    environment:
      - PORT=8085
      - GATEWAY_ID=gateway2
      - GATEWAY_LIST=gateway1:8085,gateway3:8085
    networks:
      - gateway-network
    restart: unless-stopped

  gateway3:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: gateway3
    ports:
      - "8089:8085"
    environment:
      - PORT=8085
      - GATEWAY_ID=gateway3
      - GATEWAY_LIST=gateway1:8085,gateway2:8085
    networks:
      - gateway-network
    restart: unless-stopped

networks:
  gateway-network:
    driver: bridge
